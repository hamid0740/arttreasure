name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web & Capacitor Dependencies
        run: npm install

      - name: Sync Web Assets to Android Project
        run: npx cap copy android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Cordova Plugin Stubs Exist
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare Versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ArtTreasure-v${{ env.APP_VERSION }}.apk"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "ArtTreasure v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: "ArtTreasure-v${{ env.APP_VERSION }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
